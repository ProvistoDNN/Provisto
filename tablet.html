<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Provisto · Tablet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Gochi+Hand&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  /* Paleta Provisto */
  --forest:#1B4332; --forest-2:#2D6A4F; --forest-hover:#143426; --forest-soft:#E4EEE7; --sage:#BCD0C3;
  --mocha:#E8DCC6; --mocha-soft:#F3ECDF; --cream:#F8F4EB;
  --burgundy:#722F37; --burgundy-soft:#F7ECEC; --burgundy-line:#EBD3D5;
  --caramel:#A97C50; --caramel-soft:#F5ECDF; --caramel-line:#E9D7BF;
  --white:#FFFFFF; --text:#1C2B23; --text2:#45504A; --muted:#857D70;
  --border:#ECE4D6; --border2:#F2ECE1;
  --amber:#946312; --amber-bg:#FBF1DC; --amber-line:#F0DDB0;
  --radius:14px; --shadow:0 1px 2px rgba(40,30,15,.04),0 2px 6px rgba(40,30,15,.03);
  --shadow-lg:0 16px 48px rgba(27,43,35,.16);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Poppins',sans-serif;background:#E9E2D4;color:var(--text);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-weight:700;letter-spacing:-.015em;color:var(--forest)}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:13.5px}
svg.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* ---------- Sidebar ---------- */
.sidebar{position:fixed;inset:0 auto 0 0;width:240px;background:var(--forest);display:flex;flex-direction:column;padding:26px 14px 16px;z-index:20;color:#F3EEE3}
.logo{padding:0 12px 30px}
.logo .word{display:flex;align-items:flex-end;line-height:1;color:var(--cream)}
.logo .pro{font-family:'Poppins';font-weight:300;font-size:29px;letter-spacing:.01em}
.logo .visto{font-family:'Gochi Hand','Segoe Print','Comic Sans MS',cursive;font-size:39px;line-height:.78;letter-spacing:.01em;margin-left:1px}
.logo .tag{font-size:7.6px;letter-spacing:.2em;color:rgba(248,244,235,.72);margin-top:8px;font-weight:500}
.nav-label{font-size:10.5px;font-weight:600;color:rgba(248,244,235,.45);text-transform:uppercase;letter-spacing:.12em;padding:0 12px 8px}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:rgba(248,244,235,.78);font-weight:400;border:none;background:none;width:100%;text-align:left;font-size:13.5px;margin-bottom:2px;transition:background .12s,color .12s}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:#2C5A45;color:#fff;font-weight:600}
.nav-item .count{margin-left:auto;background:var(--burgundy);color:#fff;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:20px}
.side-bottom{margin-top:auto}
.side-sep{border-top:1px solid rgba(248,244,235,.12);margin:10px 0}
.side-store{padding:6px 12px 2px;font-size:12px;color:rgba(248,244,235,.6);line-height:1.45}
.side-store b{color:#F3EEE3;font-weight:500}
.arcs{display:flex;gap:4px;padding:4px 12px 12px}
.user-card{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;margin-top:2px}
.user-card:hover{background:rgba(255,255,255,.06)}
.user-card.active{background:#2C5A45}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--caramel);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12.5px;flex-shrink:0}
.user-card .n{font-weight:600;font-size:13px;color:#fff}
.user-card .r{font-size:11.5px;color:rgba(248,244,235,.6)}

/* ---------- Main / topbar ---------- */
.main{margin-left:240px;min-height:100vh}
.topbar{position:sticky;top:0;z-index:15;height:66px;background:rgba(248,244,235,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 28px;gap:10px}
.topbar .title{font-weight:600;font-size:16px;color:var(--forest);margin-right:auto}
.tb-chip{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;background:var(--white);border:1px solid var(--border);border-radius:10px;color:var(--text2);font-size:13px;font-weight:500}
.tb-chip select{border:none;background:none;font-weight:500;color:var(--text);outline:none;cursor:pointer;font-size:13px}
.tb-chip .ic{color:var(--caramel)}
.icon-btn{position:relative;width:38px;height:38px;display:flex;align-items:center;justify-content:center;background:var(--white);border:1px solid var(--border);border-radius:10px;color:var(--forest)}
.icon-btn:hover{background:var(--mocha-soft)}
.icon-btn .dot{position:absolute;top:-6px;right:-6px;background:var(--burgundy);color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:10px;display:flex;align-items:center;justify-content:center;border:2px solid var(--cream)}
.tb-avatar{cursor:pointer;background:var(--forest)}
.content{padding:28px 28px 56px;max-width:1440px}

/* ---------- Dropdown ---------- */
.dropdown{position:absolute;top:72px;right:76px;width:390px;background:var(--white);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-lg);z-index:40;overflow:hidden;display:none}
.dropdown.open{display:block}
.dd-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border2)}
.dd-head b{font-size:13.5px;color:var(--forest)}
.dd-item{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border2);cursor:pointer}
.dd-item:hover{background:var(--cream)}
.dd-item:last-child{border-bottom:none}
.dd-item .t{font-size:12.5px;color:var(--text2)}
.dd-item .time{font-size:11px;color:var(--muted);margin-top:2px}

/* ---------- Page head ---------- */
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.18em;color:var(--burgundy);text-transform:uppercase;margin-bottom:4px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:24px}
.page-head h1{font-size:27px;line-height:1.2}
.page-head p{color:var(--muted);margin-top:4px;font-size:14px}
.head-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}

/* ---------- Cards ---------- */
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:20px}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 20px 0}
.card-head h3{font-size:14.5px;font-weight:600}
.card-head .sub{font-size:12px;color:var(--muted);margin-top:1px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g-main{grid-template-columns:2fr 1fr}
.g-svc{grid-template-columns:1.55fr 1fr}
.mb16{margin-bottom:16px}

.kpi{padding:18px 20px}
.kpi .k-top{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.k-ic{width:32px;height:32px;border-radius:9px;background:var(--forest-soft);color:var(--forest);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.k-ic.bur{background:var(--burgundy-soft);color:var(--burgundy)}
.k-ic.car{background:var(--caramel-soft);color:var(--caramel)}
.kpi .k-val{font-size:27px;font-weight:700;margin:8px 0 2px;letter-spacing:-.02em;color:var(--forest)}
.kpi .k-val.bur{color:var(--burgundy)}
.kpi .k-val small{font-size:13px;font-weight:500;color:var(--muted);margin-left:4px}
.kpi .k-sub{font-size:12px;color:var(--muted)}
.up{color:var(--forest-2);font-weight:600}.down{color:var(--burgundy);font-weight:600}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 15px;border-radius:10px;font-size:13px;font-weight:600;border:1px solid var(--border);background:var(--white);color:var(--forest);transition:all .12s;white-space:nowrap}
.btn:hover{background:var(--mocha-soft)}
.btn-primary{background:var(--forest);border-color:var(--forest);color:#fff}
.btn-primary:hover{background:var(--forest-hover)}
.btn-soft{background:var(--forest-soft);border-color:var(--forest-soft);color:var(--forest)}
.btn-soft:hover{background:#D6E6DB}
.btn-danger{background:var(--burgundy);border-color:var(--burgundy);color:#fff}
.btn-danger:hover{background:#5E262D}
.btn-sm{height:31px;padding:0 11px;font-size:12px;border-radius:8px}
.btn-icon{width:31px;padding:0;justify-content:center}
.btn:disabled{opacity:.4;cursor:not-allowed}
.link{color:var(--burgundy);font-weight:600;font-size:12.5px;background:none;border:none;display:inline-flex;align-items:center;gap:4px}
.link:hover{color:#5E262D}

/* ---------- Badges ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.badge.nodot::before{display:none}
.b-green{background:var(--forest-soft);color:var(--forest)}
.b-red{background:var(--burgundy-soft);color:var(--burgundy)}
.b-amber{background:var(--amber-bg);color:var(--amber)}
.b-car{background:var(--caramel-soft);color:#8A6238}
.b-blue{background:#E9EEF3;color:#3B5873}
.b-gray{background:#F1ECE3;color:var(--muted)}

/* ---------- Tables ---------- */
.tbl{width:100%;border-collapse:collapse}
.tbl th{white-space:nowrap;text-align:left;font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;padding:12px 14px;border-bottom:1px solid var(--border);background:#FCFAF6}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--border2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr:hover td{background:#FDFBF7}
.tbl.compact th,.tbl.compact td{padding-left:10px;padding-right:10px}
.tbl tfoot td{background:#FCFAF6;font-weight:600;border-top:1px solid var(--border);color:var(--forest)}
.tbl .num{font-variant-numeric:tabular-nums}
.tbl th.r,.tbl td.r{text-align:right}
.tbl th.c,.tbl td.c{text-align:center}
.pcell{display:flex;align-items:center;gap:12px}
.thumb{border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--mocha-soft);color:var(--caramel);border:1px solid var(--caramel-line)}
.pname{font-weight:600;color:var(--text);white-space:nowrap}
.muted{color:var(--muted)}.sm{font-size:12px}
.actions{display:flex;gap:6px;justify-content:flex-end}
.input{height:38px;border:1px solid var(--border);border-radius:10px;padding:0 12px;background:var(--white);color:var(--text);outline:none;width:100%;transition:border .12s,box-shadow .12s}
.input:focus{border-color:var(--forest-2);box-shadow:0 0 0 3px rgba(45,106,79,.13)}
.input:disabled{background:#FAF7F1;color:var(--text2);border-color:var(--border2)}
.input-num{width:84px;height:34px;text-align:right;font-variant-numeric:tabular-nums}
.input-num.hl-bur{background:var(--burgundy-soft);border-color:var(--burgundy-line);color:var(--burgundy);font-weight:600}
.label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px}
.field{margin-bottom:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* ---------- Segmented / chips ---------- */
.seg{display:inline-flex;background:#EFE8DB;border-radius:10px;padding:3px}
.seg button{border:none;background:none;padding:6px 14px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--white);color:var(--forest);box-shadow:var(--shadow)}
.ctx{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:20px;background:#F1ECE2;color:var(--text2);font-size:12px;font-weight:500}
.ctx .ic{color:var(--caramel)}
.pchips{display:flex;gap:6px;flex-wrap:wrap}
.pchip{border:1px solid var(--border);background:var(--white);color:var(--text2);padding:5px 11px;border-radius:20px;font-size:12px;font-weight:500}
.pchip.on{background:var(--forest);border-color:var(--forest);color:#fff}

/* ---------- Lists ---------- */
.list-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border2)}
.list-row:last-child{border-bottom:none}
.bar{height:6px;background:#EFE9DE;border-radius:6px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--forest-2);border-radius:6px}
.bar.bur i{background:#B0656D}.bar.amb i{background:#C9A15C}

/* ---------- Alerts ---------- */
.alert{display:flex;gap:12px;padding:13px 14px;border-radius:12px;border:1px solid;border-left-width:3px}
.alert + .alert{margin-top:10px}
.al-red{background:var(--burgundy-soft);border-color:var(--burgundy-line);border-left-color:var(--burgundy)}
.al-amber{background:var(--caramel-soft);border-color:var(--caramel-line);border-left-color:var(--caramel)}
.al-stock{background:var(--amber-bg);border-color:var(--amber-line);border-left-color:#C9932A}
.al-ok{background:#F4F8F5;border-color:#DCE8DF;border-left-color:var(--forest-2)}
.al-done{background:#FBFAF7;border-color:var(--border);border-left-color:var(--forest-2)}
.al-tag{font-size:10px;font-weight:700;letter-spacing:.12em}
.al-red .al-tag{color:var(--burgundy)}.al-amber .al-tag{color:#8A6238}.al-stock .al-tag{color:var(--amber)}.al-ok .al-tag,.al-done .al-tag{color:var(--forest-2)}
.al-title{font-weight:600;font-size:13px;margin-top:1px}
.al-red .al-title{color:var(--burgundy)}.al-amber .al-title{color:#7A5530}.al-stock .al-title{color:var(--amber)}.al-ok .al-title,.al-done .al-title{color:var(--forest)}
.al-msg{font-size:12.5px;color:var(--text2);margin-top:2px}
.al-body{flex:1;min-width:0}
.al-time{font-size:11px;color:var(--muted);white-space:nowrap}
.al-actions{display:flex;gap:6px;margin-top:10px}

/* ---------- Service cards ---------- */
.scard{padding:18px}
.scard .s-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.s-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.s-stat{background:var(--cream);border-radius:10px;padding:9px 11px}
.s-stat .l{font-size:10.5px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.06em}
.s-stat .v{font-size:19px;font-weight:700;margin-top:1px;color:var(--forest)}
.s-foot{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:1px solid var(--border2)}

/* ---------- Why panel ---------- */
.why{background:linear-gradient(180deg,#FBF7EF,#FFFFFF)}
.factors{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
.factor{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:14px}
.factor .f-ic{width:34px;height:34px;border-radius:10px;background:var(--mocha-soft);border:1px solid var(--caramel-line);color:var(--caramel);display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.factor .f-t{font-weight:600;font-size:13px;display:flex;justify-content:space-between;gap:8px;color:var(--forest)}
.factor .f-d{font-size:12px;color:var(--muted);margin-top:3px}

/* ---------- Banners ---------- */
.banner{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:14px;background:var(--forest);color:#fff;margin-bottom:16px}
.banner .b-ic{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;display:flex;align-items:center;justify-content:center}
.banner b{font-size:14px}
.banner p{font-size:12.5px;color:rgba(255,255,255,.78)}
.banner .btn{background:transparent;border-color:rgba(255,255,255,.35);color:#fff}
.banner .btn:hover{background:rgba(255,255,255,.1)}
.hero{position:relative;overflow:hidden;background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:22px 24px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.hero h1{font-size:26px}
.hero p{color:var(--muted);margin-top:2px}
.hero-arcs{position:absolute;right:-6px;bottom:-14px;opacity:.9;pointer-events:none}
.weather{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--cream);border:1px solid var(--border);border-radius:10px;font-size:12.5px;color:var(--text2)}
.weather .ic{color:var(--caramel)}

/* ---------- Modal ---------- */
.modal-back{position:absolute;inset:0;background:rgba(20,32,26,.42);display:flex;align-items:center;justify-content:center;z-index:100;animation:fade .15s ease}
.modal{background:var(--white);border-radius:20px;box-shadow:var(--shadow-lg);width:490px;max-width:calc(100% - 40px);max-height:88%;overflow:auto;animation:pop .16s ease}
.modal.wide{width:610px}
.m-head{display:flex;align-items:flex-start;justify-content:space-between;padding:22px 22px 0}
.m-head h3{font-size:17px}
.m-head p{font-size:12.5px;color:var(--muted);margin-top:3px}
.m-body{padding:18px 22px}
.m-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 22px 20px;border-top:1px solid var(--border2)}
.x-btn{border:none;background:none;color:var(--muted);padding:4px;border-radius:7px}
.x-btn:hover{background:var(--cream)}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}}
.reco{display:flex;gap:12px;padding:12px;border:1px solid var(--border);border-radius:12px;margin-bottom:8px;cursor:pointer;transition:all .12s}
.reco:hover{border-color:var(--sage);background:#FAFCFA}
.reco.sel{border-color:var(--forest-2);background:#F4F8F5;box-shadow:0 0 0 3px rgba(45,106,79,.1)}
.reco .r-ic{width:32px;height:32px;border-radius:9px;background:var(--mocha-soft);color:var(--caramel);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.reco .r-t{font-weight:600;font-size:13px;color:var(--forest)}
.reco .r-d{font-size:12px;color:var(--muted);margin-top:1px}

/* ---------- Toast ---------- */
#toasts{position:absolute;bottom:24px;right:24px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{display:flex;align-items:center;gap:10px;background:var(--forest);color:#fff;padding:12px 16px;border-radius:12px;box-shadow:var(--shadow-lg);font-size:13px;font-weight:500;animation:pop .2s ease;max-width:400px}
.toast .t-ic{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.toast .t-ic svg{width:13px;height:13px;stroke-width:2.6}
.toast.warn{background:var(--burgundy)}

/* ---------- Misc ---------- */
.chart-box{position:relative;height:270px;padding:12px 20px 18px}
.chart-box.sm{height:235px}
.empty{padding:36px;text-align:center;color:var(--muted)}
.toggle{position:relative;width:38px;height:22px;background:#D9D1C3;border-radius:20px;border:none;transition:background .15s;flex-shrink:0}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle.on{background:var(--forest-2)}
.toggle.on::after{left:19px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:13px 0;border-bottom:1px solid var(--border2)}
.set-row:last-child{border-bottom:none}
.set-row .t{font-weight:600;color:var(--forest)}
.set-row .d{font-size:12px;color:var(--muted)}
.chk-ok{color:var(--forest-2);display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600}
.chk-warn{color:var(--burgundy);display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600}
.search{position:relative}
.search svg{position:absolute;left:11px;top:11px;color:var(--muted)}
.search .input{padding-left:36px;width:240px}
.sum-card{padding:18px 20px;border-radius:14px;background:var(--white);border:1px solid var(--border)}
.sum-card .l{font-size:10.5px;color:var(--muted);font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.sum-card .v{font-size:26px;font-weight:700;margin-top:4px;color:var(--forest)}
.icon-pick{display:flex;gap:6px;flex-wrap:wrap}
.icon-pick button{width:42px;height:42px;border-radius:10px;border:1px solid var(--border);background:var(--mocha-soft);color:var(--caramel);display:flex;align-items:center;justify-content:center}
.icon-pick button.on{border-color:var(--forest-2);box-shadow:0 0 0 3px rgba(45,106,79,.14);color:var(--forest)}
.foot-note{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 20px;border-top:1px solid var(--border)}
.foot-note .t{font-size:12.5px;color:var(--text2)}
.foot-note .t b{color:var(--burgundy)}
.step-n{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;flex-shrink:0}
.plan-card{background:var(--forest);color:#fff;border-radius:var(--radius);padding:20px;position:relative;overflow:hidden}
.plan-card h3{color:#fff;font-size:18px}
.plan-card .muted{color:rgba(255,255,255,.7)}
.plan-card ul{list-style:none;margin-top:12px}
.plan-card li{display:flex;gap:8px;align-items:center;font-size:12.5px;padding:3px 0;color:rgba(255,255,255,.9)}
.plan-card li .ic{color:#D9B98F}
.ref-card{background:var(--mocha-soft);border:1px dashed var(--caramel);border-radius:var(--radius);padding:18px 20px}
.code{font-family:ui-monospace,Menlo,monospace;background:var(--white);border:1px solid var(--caramel-line);padding:6px 12px;border-radius:8px;font-weight:600;color:var(--forest);letter-spacing:.06em}

/* =================== VERSIÓN TABLET =================== */
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding-top:56px}
#stagebar{position:fixed;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;z-index:5;background:#fff;border:1px solid var(--border);border-radius:14px;padding:6px 6px 6px 14px;box-shadow:var(--shadow);white-space:nowrap}
#stagebar .lbl{font-size:12px;font-weight:600;color:var(--forest)}
#stagebar .btn,#exit-full{height:34px;font-size:12px}
#device{position:relative;flex-shrink:0;background:#1F2522;border-radius:50px;padding:18px;box-shadow:0 30px 80px rgba(20,30,25,.32),inset 0 0 0 2px #3A433E;transform-origin:center center}
#device::before{content:'';position:absolute;width:8px;height:8px;border-radius:50%;background:#3A433E;top:5px;left:50%;margin-left:-4px}
#device.land::before{top:50%;left:5px;margin:-4px 0 0}
#screen{position:relative;overflow:hidden;background:var(--cream);border-radius:32px;container-type:size;container-name:scr}
#exit-full{display:none;position:fixed;right:14px;bottom:14px;z-index:300;box-shadow:var(--shadow-lg)}
body.full{background:var(--cream)}
body.full #stage{padding:0}
body.full #stagebar{display:none}
body.full #device{padding:0;border-radius:0;background:none;box-shadow:none;transform:none!important}
body.full #device::before{display:none}
body.full #screen{width:100vw!important;height:100vh!important;height:100dvh!important;border-radius:0}
body.full.desk #exit-full{display:inline-flex}

.app{display:flex;height:100%;width:100%}
.rail{width:96px;flex-shrink:0;background:var(--forest);display:flex;flex-direction:column;align-items:center;padding:20px 9px 14px;overflow-y:auto}
.mark{text-align:center;color:var(--cream);line-height:.85;margin-bottom:20px}
.mark .pro{font-weight:300;font-size:18px;letter-spacing:.04em}
.mark .visto{font-family:'Gochi Hand','Segoe Print','Comic Sans MS',cursive;font-size:25px}
#rail-nav{display:flex;flex-direction:column;gap:4px}
.rail-item{position:relative;width:78px;min-height:64px;border:none;background:none;border-radius:14px;color:rgba(248,244,235,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:10.5px;font-weight:500;line-height:1.15;text-align:center;padding:6px 4px;transition:background .12s}
.rail-item:active{background:rgba(255,255,255,.1)}
.rail-item.active{background:#2C5A45;color:#fff;font-weight:600}
.count{position:absolute;top:5px;right:12px;background:var(--burgundy);color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--forest)}
.rail-bottom{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:12px}
.app-main{flex:1;min-width:0;display:flex;flex-direction:column}
#scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.topbar{position:relative;top:auto;height:70px;flex-shrink:0;padding:0 22px;gap:8px}
.tb-logo{display:none;align-items:flex-end;color:var(--forest);line-height:1;margin-right:auto}
.tb-logo .pro{font-weight:300;font-size:22px}
.tb-logo .visto{font-family:'Gochi Hand','Segoe Print','Comic Sans MS',cursive;font-size:30px;line-height:.78}
.tb-p{display:none}
.content{padding:22px 24px 40px;max-width:none}
.tabbar{display:none;flex-shrink:0;background:var(--forest);padding:7px 8px 10px;gap:4px}
.tab{position:relative;flex:1;border:none;background:none;color:rgba(248,244,235,.72);display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 2px 7px;border-radius:14px;font-size:10.5px;font-weight:500}
.tab.active{background:#2C5A45;color:#fff;font-weight:600}
.tab .count{right:calc(50% - 24px)}
.dropdown{top:74px;right:16px;width:min(390px,calc(100% - 32px))}

/* Objetivos táctiles */
.btn{height:44px;padding:0 16px;border-radius:12px}
.btn:active{transform:scale(.98)}
.btn-sm{height:38px;padding:0 13px;font-size:12.5px;border-radius:10px}
.btn-icon{width:38px;padding:0}
.input{height:44px;border-radius:12px}
.tb-chip{height:44px;border-radius:12px}
.icon-btn{width:44px;height:44px;border-radius:12px}
.tb-avatar{width:40px;height:40px}
.seg button{padding:9px 16px}
.pchip{padding:9px 14px;font-size:12.5px}
.toggle{width:48px;height:28px}
.toggle::after{width:22px;height:22px}
.toggle.on::after{left:23px}
.reco{padding:14px}
.icon-pick button{width:48px;height:48px}
.list-row{padding:12px 0}

/* Selector de cantidades (− / +) */
.stepper{display:inline-flex;align-items:center;height:44px;border:1px solid var(--border);border-radius:12px;background:#fff;overflow:hidden;flex-shrink:0}
.stepper button{width:40px;height:100%;border:none;background:var(--cream);color:var(--forest);display:flex;align-items:center;justify-content:center}
.stepper button:active{background:var(--mocha)}
.stepper input{width:50px;height:100%;border:none;text-align:center;font:600 15px 'Poppins',sans-serif;color:var(--text);outline:none;background:#fff;-moz-appearance:textfield;appearance:textfield}
.stepper input::-webkit-inner-spin-button,.stepper input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.stepper.off{background:#FAF7F1}
.stepper.off input{background:#FAF7F1;color:var(--text2)}
.stepper.off button{pointer-events:none;color:#C9C0B0;background:#FAF7F1}
.stepper.hl-bur{border-color:var(--burgundy-line)}
.stepper.hl-bur input{background:var(--burgundy-soft);color:var(--burgundy)}

/* Listas por filas (reemplazan tablas en pantallas operativas) */
.rows .rhead,.rows .rrow,.rows .rfoot{display:grid;align-items:center;column-gap:10px;padding:12px 18px}
.rows .rhead{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;background:#FCFAF6;border-bottom:1px solid var(--border);padding-top:11px;padding-bottom:11px;white-space:nowrap}
.rows .rrow{border-bottom:1px solid var(--border2)}
.rows .rfoot{background:#FCFAF6;font-weight:600;color:var(--forest);border-top:1px solid var(--border)}
.rows .r{text-align:right}.rows .c{text-align:center}.rows .jr{justify-self:end}.rows .jc{justify-self:center}
.cl{display:none;font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px}
.show-p{display:none}
.pron .rhead,.pron .rrow,.pron .rfoot{grid-template-columns:minmax(170px,1.5fr) 74px 86px 136px 82px 110px 232px}
.cier .rhead,.cier .rrow,.cier .rfoot{grid-template-columns:minmax(160px,1.4fr) 64px repeat(4,132px) 100px}
.g-rank{grid-template-columns:1fr}

/* ---------- Vertical (tablet en retrato) ---------- */
@container scr (max-width: 900px){
  .rail{display:none}
  .tabbar{display:flex}
  .tb-logo,.tb-p{display:flex}
  .tb-l,.topbar .title{display:none!important}
  .content{padding:20px 20px 32px}
  .page-head{flex-direction:column;align-items:flex-start;gap:14px}
  .head-actions{justify-content:flex-start}
  .hero{flex-direction:column;align-items:flex-start}
  .g4,.g3{grid-template-columns:repeat(2,1fr)}
  .g3>.span-p{grid-column:1/-1}
  .g2,.g-main,.g-svc{grid-template-columns:1fr}
  .factors{grid-template-columns:repeat(2,1fr)}
  .hide-p{display:none!important}
  .show-p{display:inline}
  .rows .rhead{display:none}
  .cl{display:block}
  .rows .r,.rows .c{text-align:left}
  .rows .jr,.rows .jc{justify-self:start}
  .pron .rrow{grid-template-columns:repeat(3,1fr);grid-template-areas:"prod prod est" "last rec conf" "step act act";row-gap:14px;padding:16px 18px}
  .pron .a-prod{grid-area:prod}.pron .a-last{grid-area:last}.pron .a-rec{grid-area:rec}.pron .a-step{grid-area:step}
  .pron .a-conf{grid-area:conf}.pron .a-est{grid-area:est;justify-self:end;text-align:right}.pron .a-act{grid-area:act;justify-self:end;align-self:end}
  .pron .rfoot{grid-template-columns:repeat(4,1fr)}
  .cier .rrow{grid-template-columns:repeat(4,1fr);grid-template-areas:"prod prod prod ctrl" "sold sobr desc falt";row-gap:12px;padding:16px 18px}
  .cier .a-prod{grid-area:prod}.cier .a-ctrl{grid-area:ctrl;justify-self:end}.cier .a-prodn{display:none}
  .cier .a-sold{grid-area:sold}.cier .a-sobr{grid-area:sobr}.cier .a-desc{grid-area:desc}.cier .a-falt{grid-area:falt}
  .cier .rfoot{grid-template-columns:repeat(3,1fr);row-gap:12px}
  .rows .e{display:none}
  #toasts{bottom:100px;left:20px;right:20px;align-items:center}
  .foot-note{flex-wrap:wrap}
}
</style>
</head>

<div id="stagebar"><span class="lbl">Vista tablet</span>

/* Curva de venta esperada durante el día (7 a 20 h) */
const W=[.09,.14,.14,.11,.08,.07,.06,.05,.06,.07,.07,.06,.05]; const WS=sum(W);
const NOW=11.7; // 11:42
function E(t){ if(t<=7) return 0; if(t>=20) return 1; let c=0; for(let h=7;h<20;h++){ if(t>=h+1) c+=W[h-7]; else { c+=W[h-7]*(t-h); break; } } return c/WS; }
function timeFor(frac){ for(let t=7;t<=20;t+=.05){ if(E(t)>=frac) return t } return 20 }
const hh=t=>`${Math.round(t)} h`;

function buildBranch(f){
  const r=n=>Math.round(n*f);
  const forecast=BASE.forecast.map(x=>({...x,last:r(x.last),rec:r(x.rec),prod:r(x.prod)}));
  const service=forecast.map(x=>({pid:x.pid,sold:Math.min(r(BASE.sold[x.pid]),effProd(x))}));
  const closing=forecast.map(x=>{
    const c=BASE.closing[x.pid], p=effProd(x), sold=Math.min(r(c.sold),p);
    return {pid:x.pid,sold,sobr:p-sold,desc:Math.min(r(c.desc),p-sold),falt:r(c.falt),franja:c.fr||''};
  });
  return {f,forecast,service,closing,closingSaved:false,productionConfirmed:false,editing:{},applied:{},dismissed:{}};
}
function sum(a){return a.reduce((x,y)=>x+y,0)}

function stepAdj(id,d){const el=document.getElementById(id); if(!el||el.disabled) return; el.value=Math.max(0,(parseInt(el.value)||0)+d); el.dispatchEvent(new Event('input',{bubbles:true}));}

const ST={
  normal:{label:'En línea',cls:'b-green',tag:'EN LÍNEA',al:'al-ok',icon:'check'},
  exceso:{label:'Bajo el ritmo',cls:'b-red',tag:'ALERTA',al:'al-red',icon:'alert'},
  alta:{label:'Ritmo alto',cls:'b-car',tag:'ATENCIÓN',al:'al-amber',icon:'trending'},
  bajo:{label:'Stock bajo',cls:'b-amber',tag:'STOCK BAJO',al:'al-stock',icon:'package'},
  agotado:{label:'Agotado',cls:'b-gray',tag:'AGOTADO',al:'al-stock',icon:'package'}
};
function svc(d=cur()){
  const en=E(NOW);
  return d.service.map(s=>{
    const f=d.forecast.find(x=>x.pid===s.pid), p=P(s.pid); if(!p||!f) return null;
    const prod=effProd(f), rem=Math.max(prod-s.sold,0), expF=prod*en, exp=Math.round(expF);
    let st='normal';
    if(rem===0) st='agotado';
    else if(rem<=Math.max(3,Math.round(prod*.15))) st='bajo';
    else if(s.sold>expF*1.15) st='alta';
    else if(s.sold<expF*.85) st='exceso';
    const dev=Math.round((s.sold-expF)/expF*100);
    const projected=s.sold/en, risk=Math.max(Math.round(prod-projected),0);
    const outAt=s.sold>0?timeFor(prod*en/s.sold):20;
    return {...s,p,prod,rem,exp,st,dev,risk,outAt};
  }).filter(Boolean);
}
function alertInfo(x){

  if(x.st==='alta') return {title:`${n}: ritmo alto`,msg:`La demanda está superando lo previsto (+${x.dev}%). Posible faltante a las ${hh(x.outAt)}.`,sug:'Sugerencia: hornear un lote corto antes de las 14 h.',quick:'Hornear lote'};
  if(x.st==='bajo') return {title:`${n}: quedan pocas unidades`,msg:`Quedan ${x.rem} unidades disponibles. Al ritmo actual se agotan cerca de las ${hh(x.outAt)}.`,sug:'Sugerencia: priorizar la venta en mostrador.',quick:'Priorizar venta'};

  return {title:`${n} en línea`,msg:'Ventas dentro de lo esperado.',sug:''};
}

function factor(icon,t,v,desc){return `<div class="factor"><div class="f-ic">${ic(icon,17)}</div><div class="f-t"><span>${t}</span><span class="sm" style="font-weight:600;color:var(--text2)">${v}</span></div><div class="f-d">${desc}</div></div>`}
function pronConfirm(pid){const f=fcBy(pid);f.prod=f.rec;f.status='confirmado';render();toast(`${P(pid).name}: ${f.rec} u. confirmadas`)}

function pronSave(pid){

// Mantiene coherentes servicio y cierre cuando cambia lo producido
function syncDay(){
  const d=cur();
  d.service.forEach(s=>{const f=d.forecast.find(x=>x.pid===s.pid); if(f) s.sold=Math.min(s.sold,effProd(f))});
  if(!d.closingSaved) d.closing.forEach(c=>{const f=d.forecast.find(x=>x.pid===c.pid); if(!f) return; const p=effProd(f); c.sold=Math.min(c.sold,p); c.sobr=p-c.sold; c.desc=Math.min(c.desc,c.sobr)});
}

function chartsServicio(){
  const x=svc().find(y=>y.pid===state.svcProduct); if(!x) return;
  const en=E(NOW), expPts=[], realPts=[];
  for(let t=7;t<=20.001;t+=.25) expPts.push({x:+t.toFixed(2),y:+(x.prod*E(t)).toFixed(1)});
  const k=x.st==='exceso'?1.12:x.st==='normal'?1:.92;
  for(let t=7;t<NOW;t+=.25) realPts.push({x:+t.toFixed(2),y:+(x.sold*Math.pow(E(t)/en,k)).toFixed(1)});
  realPts.push({x:NOW,y:x.sold});
  const col=x.st==='exceso'?C.burgundy:C.forest;
  mkChart('ch-live',{type:'line',data:{datasets:[
    {label:'Ventas reales',data:realPts,borderColor:C.forest,backgroundColor:'rgba(27,67,50,.07)',fill:true,tension:.3,borderWidth:2.5,pointRadius:c=>c.dataIndex===realPts.length-1?5:0,pointBackgroundColor:col,pointBorderColor:'#fff',pointBorderWidth:2},
    {label:'Ritmo esperado',data:expPts,borderColor:C.caramel,borderDash:[5,5],tension:.3,borderWidth:2,pointRadius:0,fill:false}
  ]},options:{...opts(),parsing:true,
    interaction:{mode:'nearest',axis:'x',intersect:false},
    scales:{x:{type:'linear',min:7,max:20,grid:{display:false},border:{display:false},ticks:{stepSize:2,callback:v=>v+' h'}},
            y:{beginAtZero:true,suggestedMax:x.prod,grid:{color:C.grid},border:{display:false},ticks:{maxTicksLimit:5}}},
    plugins:{...opts().plugins,tooltip:{...opts().plugins.tooltip,callbacks:{title:i=>{const t=i[0].parsed.x;return `${Math.floor(t)}:${String(Math.round((t%1)*60)).padStart(2,'0')} h`},label:c=>` ${c.dataset.label}: ${Math.round(c.parsed.y)} u.`}}}},
    plugins:[nowLine]});
}
function addSale(pid){

  if(after.st!==before.st){ delete d.dismissed[pid]; delete d.applied[pid]; }
  render();
  if(after.st!==before.st&&after.st!=='normal') toast(`Nueva alerta: ${P(pid).name} · ${ST[after.st].label}`,'warn');

}
const CL_LBL={sold:'Vendido',sobr:'Sobrante',desc:'Descartes',falt:'Faltante'};
const hl=(c,k)=>(k==='sobr'||k==='falt')&&c[k]>0?'hl-bur':'';
function wasteNote(){
  const r=cur().closing.filter(c=>P(c.pid)), prod=sum(r.map(c=>effProd(fcBy(c.pid)))), sobr=sum(r.map(c=>c.sobr));
  return `Desperdicio del día: <b>${pctf(prod?sobr/prod*100:0)}</b> · el registro mejora el pronóstico de mañana`;
}
function cierreCheck(c){
  const prod=effProd(fcBy(c.pid)), diff=prod-(c.sold+c.sobr);
  if(diff!==0) return `<span class="chk-warn">${ic('alert',14)}${diff>0?`Faltan ${diff} u.`:`Sobran ${-diff} u.`}</span>`;
  if(c.desc>c.sobr) return `<span class="chk-warn">${ic('alert',14)}Descartes &gt; sobrante</span>`;
  return `<span class="chk-ok">${ic('check',14)}Cuadra</span>`;
}
function cierreTot(){
  const r=cur().closing.filter(c=>P(c.pid)), t=k=>sum(r.map(c=>c[k]));
  return `<div>Total</div><div class="r"><div class="cl">Producido</div>${sum(r.map(c=>effProd(fcBy(c.pid))))}</div>${['sold','sobr','desc','falt'].map(k=>`<div class="c"><div class="cl">${CL_LBL[k]}</div>${t(k)}</div>`).join('')}<div class="e"></div>`;
}
function cierreSet(i,k,el){
  const d=cur(); d.closing[i][k]=Math.max(0,parseInt(el.value)||0);
  el.closest('.stepper').classList.toggle('hl-bur',!!hl(d.closing[i],k));
  document.getElementById('chk-'+i).innerHTML=cierreCheck(d.closing[i]);
  document.getElementById('cierre-tot').innerHTML=cierreTot();
  document.getElementById('waste-note').innerHTML=wasteNote();
}
function regSobrantes(){
  cur().closing.forEach(c=>{const f=fcBy(c.pid); if(P(c.pid)&&f){ c.sobr=Math.max(effProd(f)-c.sold,0); if(P(c.pid).shelf.n<=1&&P(c.pid).shelf.u==='días') c.desc=c.sobr; c.desc=Math.min(c.desc,c.sobr);} });
  render(); toast('Sobrantes calculados según lo producido y lo vendido');
}
function informarFaltante(){
  const rows=cur().closing.filter(c=>P(c.pid));
  openModal({title:'Informar faltante',sub:'Registrá en qué momento del día te quedaste sin stock',
    body:`<div class="field"><label class="label">Producto</label><select class="input" id="f-prod">${rows.map(c=>`<option value="${c.pid}">${P(c.pid).name}</option>`).join('')}</select></div>

      <div class="muted sm">Provisto usará este dato para ajustar la producción recomendada de mañana.</div>`,
    actions:[{label:'Cancelar'},{label:'Registrar faltante',cls:'btn-primary',fn:()=>{

      render(); toast(`Faltante registrado: ${P(pid).name}, ${q} u.`);

function guardarCierre(){
  const rows=cur().closing.filter(c=>P(c.pid));
  const bad=rows.filter(c=>{const p=effProd(fcBy(c.pid));return c.sold+c.sobr!==p||c.desc>c.sobr}).length;
  const save=()=>{cur().closingSaved=true;render();document.getElementById('scroll').scrollTop=0;toast('¡Jornada registrada! Esta información ayudará a mejorar el pronóstico de mañana.')};
  openModal({title:'Cerrar jornada',sub:`Sucursal ${BRANCHES[state.branch].name} · sábado 14 de marzo`,
    body:bad?`<div class="alert al-amber"><div class="al-body"><div class="al-msg" style="margin:0">Hay <b>${bad}</b> ${bad>1?'filas':'fila'} con diferencias entre lo producido, lo vendido y el sobrante. Podés guardar igual o revisarlas antes.</div></div></div>`
      :`<p style="color:var(--text2)">Todos los productos cuadran. Al guardar, Provisto aprende de lo que sobró y faltó, y prepara el pronóstico de mañana.</p>`,
    actions:[{label:bad?'Revisar':'Cancelar'},{label:bad?'Guardar igual':'Guardar cierre',cls:'btn-primary',fn:save}]});
}
function cierreResumen(){
  const r=cur().closing.filter(c=>P(c.pid)), t=k=>sum(r.map(c=>c[k]));
  const agot=r.filter(c=>c.falt>0||c.sold>=effProd(fcBy(c.pid)));
  const merma=sum(r.map(c=>c.desc*P(c.pid).cost));
  const next=r.map(c=>{const f=fcBy(c.pid), adj=Math.round(c.falt*.8)-Math.round(Math.max(c.sobr-1,0)*.6);
    const why=c.falt?`Faltaron ${c.falt} u.`:c.sobr>2?`Sobraron ${c.sobr} u.`:'Venta en línea';return {p:P(c.pid),rec:f.rec,next:Math.max(f.rec+adj,0),adj,why}});
  return `<div class="banner"><div class="b-ic">${ic('check',18)}</div><div style="flex:1"><b>¡Jornada registrada!</b><p>Esta información ayudará a mejorar el pronóstico de mañana.</p></div>

    <div class="sum-card"><div class="l">Productos agotados</div><div class="v">${agot.length}</div><div class="muted sm">${agot.length?agot.map(c=>P(c.pid).name).join(', '):'Ninguno'}</div></div>
  </div>

    <div class="card-head" style="padding-bottom:12px"><div><h3>Así se ajusta el pronóstico de mañana</h3><div class="sub">Domingo 15 de marzo · el modelo aprende de lo que sobró y faltó hoy</div></div><span class="badge b-green nodot">${ic('refresh',13)} Modelo actualizado</span></div>
    <table class="tbl"><thead><tr><th>Producto</th><th>Resultado de hoy</th><th class="r">Recomendado hoy</th><th class="r">Ajuste</th><th class="r">Mañana</th></tr></thead><tbody>
    ${next.map(n=>`<tr><td><div class="pcell">${thumb(n.p,30)}<span class="pname">${n.p.name}</span></div></td><td class="muted">${n.why}</td><td class="r num">${n.rec}</td><td class="r num">${diffTxt(n.adj)}</td><td class="r num"><b style="color:var(--forest)">${n.next}</b></td></tr>`).join('')}
    </tbody></table>

const WEEKS={todas:[9.8,9.1,8.0,7.2,6.5,6.1],palermo:[9.5,8.8,7.7,6.9,6.2,5.8],colegiales:[10.2,9.5,8.4,7.6,6.9,6.5]};
function rentData(){
  const pm={dia:1,semana:7,mes:30}[state.period];
  const bm={todas:1.78,palermo:1,colegiales:0.78}[state.rentBranch];
  const m=pm*bm;
  const rows=products.map(p=>{
    const b=RANK[p.id]||{u:12,w:1,f:0};
    const u=Math.round(b.u*m), w=Math.round(b.w*m), fl=Math.round(b.f*m);
    const ing=u*p.price, cost=(u+w)*p.cost, gan=ing-cost;
    return {p,u,w,fl,ing,gan,margin:ing?gan/ing*100:0,lost:fl*p.price,wasteMoney:w*p.cost,eff:u+w?u/(u+w)*100:0,before:Math.round((b.w*1.9+2)*m)};
  });
  const ing=sum(rows.map(r=>r.ing)), gan=sum(rows.map(r=>r.gan));
  const mesAhorro={todas:74300,palermo:41600,colegiales:32700}[state.rentBranch];
  const mesRec={todas:98500,palermo:55200,colegiales:43300}[state.rentBranch];
  const wk=WEEKS[state.rentBranch];
  const waste=state.period==='dia'?{todas:6.6,palermo:6.6,colegiales:6.9}[state.rentBranch]:state.period==='semana'?wk[5]:sum(wk.slice(2))/4;
  return {rows,ahorro:Math.round(mesAhorro*pm/30/100)*100,recuperadas:Math.round(mesRec*pm/30/100)*100,waste,wasteDelta:wk[0]-waste,
    descartes:sum(rows.map(r=>r.wasteMoney)),faltantes:sum(rows.map(r=>r.lost)),margin:ing?gan/ing*100:0,gan};
}

    ${kpi('Desperdicio',pctf(r.waste),'','trash','bur',`<span class="up">−${pctf(r.wasteDelta).replace('%',' pp')}</span> vs. inicio con Provisto`,'bur')}

      <div class="alert al-ok" style="margin-top:12px"><div class="al-body"><div class="al-msg" style="margin:0">Colegiales podría bajar su desperdicio replicando la segunda tanda de medialunas de Palermo.</div></div></div>

/* =========================================================
   NOTIFICACIONES
   ========================================================= */
function renderNotif(){
  const al=activeAlerts();
  document.getElementById('notif-count').textContent=al.length+1;
  document.getElementById('notif').innerHTML=`
    <div class="dd-head"><b>Notificaciones</b><button class="link" onclick="closeNotif();toast('Notificaciones marcadas como leídas')">Marcar como leídas</button></div>
    ${al.map(x=>`<div class="dd-item" onclick="go('servicio')"><span class="badge ${ST[x.st].cls}" style="align-self:flex-start">${ST[x.st].tag}</span><div><div class="t"><b>${alertInfo(x).title}.</b> ${alertInfo(x).msg}</div><div class="time">Hoy, ${BASE.alertTimes[x.pid]||'10:00'} h</div></div></div>`).join('')}
    <div class="dd-item" onclick="go('pronostico')"><span class="badge b-green" style="align-self:flex-start">LISTO</span><div><div class="t">La producción sugerida de hoy está disponible.</div><div class="time">Hoy, 07:05 h</div></div></div>`;
}
function toggleNotif(e){e.stopPropagation();document.getElementById('notif').classList.toggle('open')}
function closeNotif(){document.getElementById('notif').classList.remove('open')}
document.addEventListener('click',e=>{if(!e.target.closest('#notif'))closeNotif()});

/* =========================================================
   MODAL Y TOAST
   ========================================================= */
function openModal({title,sub,body,actions=[],wide,onOpen}){
  const root=document.getElementById('modal-root');
  root.innerHTML=`<div class="modal-back" id="mb"><div class="modal ${wide?'wide':''}">
    <div class="m-head"><div><h3>${title}</h3>${sub?`<p>${sub}</p>`:''}</div><button class="x-btn" onclick="closeModal()">${ic('x')}</button></div>
    <div class="m-body">${body}</div>
    <div class="m-foot">${actions.map((a,i)=>`<button class="btn ${a.cls||''}" data-a="${i}">${a.label}</button>`).join('')}</div></div></div>`;
  root.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const a=actions[+b.dataset.a];const r=a.fn?a.fn():null;if(r!==false)closeModal()});
  document.getElementById('mb').onclick=e=>{if(e.target.id==='mb')closeModal()};
  onOpen&&onOpen();
}
function closeModal(){document.getElementById('modal-root').innerHTML=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
function toast(msg,type){
  const t=document.createElement('div');t.className='toast'+(type==='warn'?' warn':'');
  t.innerHTML=`<div class="t-ic">${ic(type==='warn'?'alert':'check')}</div>${msg}`;
  document.getElementById('toasts').appendChild(t);
  setTimeout(()=>{t.style.transition='opacity .3s';t.style.opacity='0';setTimeout(()=>t.remove(),300)},3200);
}

/* =========================================================
   RENDER
   ========================================================= */
const VIEWS={inicio:[vInicio,chartsInicio],pronostico:[vPronostico],servicio:[vServicio,chartsServicio],cierre:[vCierre],rentabilidad:[vRent,chartsRent],productos:[vProductos],config:[vConfig],perfil:[vPerfil]};
function render(){
  killCharts();
  const [v,c]=VIEWS[state.view];
  document.getElementById('view').innerHTML=v();
  c&&c();
  renderNav(); renderNotif();
}
const DEV={land:[1180,820],port:[820,1180]};
const isTouch=()=>matchMedia('(pointer:coarse)').matches&&Math.min(screen.width,screen.height)>=600;
state.orient='land'; state.full=isTouch()||/[?&]full/.test(location.search);
function setOrient(o){state.orient=o;applyDevice();render()}
function setFull(f){state.full=f;applyDevice();render()}
function applyDevice(){
  document.body.classList.toggle('full',state.full);
  document.body.classList.toggle('desk',!isTouch());
  const [w,h]=DEV[state.orient], dev=document.getElementById('device'), scr=document.getElementById('screen');
  dev.classList.toggle('land',state.orient==='land');
  scr.style.width=w+'px'; scr.style.height=h+'px';
  document.getElementById('o-land').classList.toggle('on',state.orient==='land');
  document.getElementById('o-port').classList.toggle('on',state.orient==='port');
  fit();
}
function fit(){
  const dev=document.getElementById('device'); if(state.full){dev.style.transform='';return}
  const [w,h]=DEV[state.orient]; const sc=Math.min((innerWidth-40)/(w+36),(innerHeight-76)/(h+36),1);
  dev.style.transform=`scale(${sc})`;
}
addEventListener('resize',fit);
(function init(){
  document.getElementById('rail-arcs').innerHTML=arcs(14,3);
  document.getElementById('tb-cfg').innerHTML=ic('settings');
  applyDevice();
  document.getElementById('ic-store').innerHTML=ic('store',16);
  document.getElementById('ic-cal').innerHTML=ic('calendar',16);
  document.getElementById('ic-clock').innerHTML=ic('clock',16);
  document.getElementById('ic-bell').innerHTML=ic('bell');
  render();
})();
</script>
